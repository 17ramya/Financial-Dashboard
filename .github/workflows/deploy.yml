# Builds the Vite app and publishes the `dist` folder to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  # Deploy every time the default branch moves forward.
  push:
    branches: [main]
  # Allows a manual deployment from the Actions tab.
  workflow_dispatch:

# Required by actions/deploy-pages (pages: write + id-token: write for the OIDC token).
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build production bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs the exact dependency tree from package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Project sites are served from https://<owner>.github.io/<repository>/,
      # so Vite must emit asset URLs relative to that sub-path.
      # If you later attach a custom domain (or use an org/user root site), set
      # VITE_BASE_PATH to "/" instead.
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          # Ship dotfiles such as .nojekyll (the action skips hidden files by default).
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
