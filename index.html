<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>FinDash | Finance Dashboard</title>
    <meta
      name="description"
      content="FinDash is a responsive finance dashboard with balance trends, income vs. expense charts, expense breakdowns, transaction management, CSV/JSON export and simulated role-based access."
    />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FinDash | Finance Dashboard" />
    <meta
      property="og:description"
      content="Track balances, income and expenses with interactive charts and full transaction management."
    />
    <meta name="twitter:card" content="summary" />
    <script>
      // Apply the persisted theme before the first paint so switching back to
      // light mode does not flash the default dark theme on reload.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('fin_theme') || '"dark"');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'light' ? '#f3f4f6' : '#0b0f19');
          }
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif;">
        FinDash requires JavaScript to be enabled to display the dashboard.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
