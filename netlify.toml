# Optional: deploy the same build to Netlify (https://app.netlify.com -> Import project).
# Netlify runs the build itself, so the base path stays at the domain root.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Single-page app: every unknown path is served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints the filenames in /assets, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
